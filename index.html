<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --accent: #0071e3;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #409cff;
      --border: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    max-width: 900px;
    margin: 0 auto 32px;
    text-align: center;
  }
  header h1 { font-size: 28px; margin: 0 0 8px; }
  header p { color: var(--muted); margin: 0; font-size: 15px; }
  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card h2 { font-size: 17px; margin: 0; }
  .card .meta { color: var(--muted); font-size: 13px; }
  .card .btn {
    margin-top: 12px;
    display: inline-block;
    text-align: center;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .empty, .error {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
  }
</style>
</head>
<body>
  <header>
    <h1>My Apps</h1>
    <p>Latest builds, updated whenever I publish a new release.</p>
  </header>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none;">No apps published yet — check back soon.</div>
  <div id="error" class="error" style="display:none;">Couldn't load the app list right now.</div>

  <script>
    fetch('apps.json', { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('apps.json not found');
        return res.json();
      })
      .then(apps => {
        const grid = document.getElementById('grid');
        if (!apps.length) {
          document.getElementById('empty').style.display = 'block';
          return;
        }
        apps.forEach(app => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h2>${escapeHtml(app.name)}</h2>
            <div class="meta">Version ${escapeHtml(app.version)} · ${escapeHtml(app.date)}</div>
            <a class="btn" href="${escapeHtml(app.download_url)}" download>Download APK</a>
          `;
          grid.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('error').style.display = 'block';
      });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
