<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps</title>
<style>
  :root {
    --bone: #F1EEE6;
    --panel: #FFFFFF;
    --graphite: #1C1D1B;
    --slate: #6E6C64;
    --line: #DEDACD;
    --teal: #1F5C52;
    --teal-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bone: #16181A;
      --panel: #16181A;
      --graphite: #EDEBE3;
      --slate: #9C9A90;
      --line: #2C2E29;
      --teal: #4F9C8E;
      --teal-ink: #0C1513;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bone);
    color: var(--graphite);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 44px 20px 90px; }

  header { margin-bottom: 30px; }
  header h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  header p {
    margin: 0;
    color: var(--slate);
    font-size: 14.5px;
  }

  .list {
    border-top: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }

  .icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    flex-shrink: 0;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    color: #fff;
  }

  .info { flex: 1; min-width: 0; }
  .info h2 {
    margin: 0;
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.3;
  }
  .info .tagline {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--slate);
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .info .meta {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--slate);
  }

  .install {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--teal);
    color: var(--teal-ink);
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .install:active { opacity: 0.85; }

  .state {
    text-align: center;
    color: var(--slate);
    padding: 60px 16px;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Apps</h1>
      <p>Independently built, published straight from source.</p>
    </header>

    <div id="list" class="list"></div>
    <div id="state" class="state" style="display:none;"></div>
  </div>

  <script>
    const SHADES = ['#1F5C52', '#4A4634', '#5C4A6B', '#2E4B6E', '#6E4A2E', '#4A5C2E'];

    function hashColor(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
      return SHADES[Math.abs(h) % SHADES.length];
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function renderIcon(app) {
      if (app.icon_url) {
        return `<img class="icon" src="${escapeHtml(app.icon_url)}" alt="">`;
      }
      const letter = (app.name || '?').trim().charAt(0).toUpperCase();
      const color = hashColor(app.name || app.id || '?');
      return `<div class="icon" style="background:${color};">${escapeHtml(letter)}</div>`;
    }

    fetch('apps.json', { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('missing');
        return res.json();
      })
      .then(apps => {
        const list = document.getElementById('list');
        const state = document.getElementById('state');

        if (!apps.length) {
          state.textContent = 'No apps published yet — check back soon.';
          state.style.display = 'block';
          return;
        }

        apps.forEach(app => {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `
            ${renderIcon(app)}
            <div class="info">
              <h2>${escapeHtml(app.name)}</h2>
              ${app.tagline ? `<p class="tagline">${escapeHtml(app.tagline)}</p>` : ''}
              <p class="meta">Version ${escapeHtml(app.version)}, updated ${escapeHtml(app.date)}</p>
            </div>
            <a class="install" href="${escapeHtml(app.download_url)}" download>Install</a>
          `;
          list.appendChild(row);
        });
      })
      .catch(() => {
        const state = document.getElementById('state');
        state.textContent = "Couldn't load the app list right now.";
        state.style.display = 'block';
      });
  </script>
</body>
</html>
